export default "<ngx-spinner *ngIf=\"service.spinnerLoad\"><p style=\"color: white\">Please Wait. </p></ngx-spinner>\n<div class=\"main-content\">\n  <div class=\"container\">\n    <div class=\"col-md-4 ml-auto mr-auto\">\n      <form [formGroup]=\"loginForm\" class=\"form\" (ngSubmit)=\"onLogin()\" >\n        <div class=\"card card-login card-plain\">\n          <div class=\"card-header \">\n            <div style=\"text-align: center;\">\n               <img style=\"width: 80%\" src=\"\"/>\n              <h3 style=\"color:white\">NEC</h3>\n            </div>\n          </div>\n          <div class=\"card-body \">\n            <div\n              class=\"input-group no-border form-control-lg\"\n              [ngClass]=\"{ 'input-group-focus': focus === true }\"\n            >\n              <span class=\"input-group-prepend\">\n                <div class=\"input-group-text\">\n                  <i class=\"now-ui-icons users_circle-08\"></i>\n                </div>\n              </span>\n              <input \n                formControlName=\"username\"\n                type=\"text\"\n                class=\"form-control\"\n                placeholder=\"Username\"\n                (focus)=\"focus = true\"\n                (blur)=\"focus = false\"\n              />\n            </div>\n            <div\n              class=\"input-group no-border form-control-lg\"\n              [ngClass]=\"{ 'input-group-focus': focus2 === true }\"\n            >\n              <div class=\"input-group-prepend\">\n                <div class=\"input-group-text\">\n                  <i class=\"now-ui-icons text_caps-small\"></i>\n                </div>\n              </div>\n              <input\n                formControlName=\"password\"\n                type=\"Password\"\n                placeholder=\"Password\"\n                class=\"form-control\"\n                (focus)=\"focus2 = true\"\n                (blur)=\"focus2 = false\"\n              />\n            </div>\n          </div>\n          <div class=\"card-footer \">\n            <button\n             type=\"submit\"  [disabled]=\"loginForm.status !='VALID'\"\n              class=\"btn btn-boa btn-round btn-lg btn-block mb-3\"\n              >Login</button\n            >\n       <!--      <div class=\"pull-left\">\n              <h6>\n                <a href=\"#pablo\" class=\"link footer-link\">Create Account</a>\n              </h6>\n            </div>\n            <div class=\"pull-right\">\n              <h6><a href=\"#pablo\" class=\"link footer-link\">Need Help?</a></h6>\n            </div> -->\n          </div>\n        </div>\n      </form>\n    </div>\n  </div>\n</div>\n"
